<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06100e">
<title>LeadEngine Start</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06100e;color:#f4fff9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(460px,92vw);background:#0d1c18;border:1px solid #48ffa228;border-radius:22px;padding:24px}.brand{font-size:25px;font-weight:900}.brand span{color:#48ffa2}.muted{color:#829e94;font-size:12px;line-height:1.5}.field,button{width:100%;border-radius:12px;padding:13px 14px;font-size:16px}.field{margin:10px 0;background:#06100e;color:#fff;border:1px solid #48ffa228}.start{border:0;background:#48ffa2;color:#04100a;font-weight:900;cursor:pointer;margin-top:14px}.stop{border:1px solid #ff5f7d66;background:#201014;color:#ff91a5;font-weight:800;cursor:pointer;margin-top:10px}.state{margin:20px 0;padding:18px;border:1px solid #48ffa228;border-radius:16px;text-align:center}.big{font-size:30px;font-weight:900}.on{color:#48ffa2}.off{color:#ff91a5}.hidden{display:none}.error{color:#ff91a5;font-size:12px;margin-top:8px}.back{display:block;text-align:center;color:#829e94;text-decoration:none;margin-top:16px;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">⚡ Lead<span>Engine</span></div>
  <div class="muted">Live outreach control</div>

  <div id="loginBox">
    <input class="field" id="email" value="hayaautomation2026@gmail.com" readonly>
    <input class="field" id="password" type="password" placeholder="Password">
    <button class="start" onclick="login()">Unlock</button>
    <div id="error" class="error"></div>
  </div>

  <div id="control" class="hidden">
    <div class="state">
      <div class="muted">SDR STATUS</div>
      <div id="state" class="big off">OFF</div>
      <div id="info" class="muted">No emails can send.</div>
    </div>
    <button id="startBtn" class="start" onclick="startSDR()">▶ START 3-EMAIL TEST</button>
    <button id="stopBtn" class="stop" onclick="stopSDR()">■ STOP SDR</button>
    <a class="back" href="/dashboard">Back to dashboard</a>
  </div>
</div>
<script>
const SB='https://jequjltbvofmhfnbsfzt.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXVqbHRidm9mbWhmbmJzZnp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NjM3MDYsImV4cCI6MjA5ODMzOTcwNn0.swI7ZldCu4W0fyFNjiOoBMkINEKBfozAVnVJjXj_6VM';
let access='',refresh='';
const $=id=>document.getElementById(id);
async function auth(url,body){const r=await fetch(SB+url,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error('Login failed');return j}
async function login(){try{const j=await auth('/auth/v1/token?grant_type=password',{email:$('email').value,password:$('password').value});access=j.access_token;refresh=j.refresh_token;sessionStorage.setItem('le_refresh',refresh);$('loginBox').classList.add('hidden');$('control').classList.remove('hidden');await refreshStatus()}catch(e){$('error').textContent='Wrong password or connection failed.'}}
async function renew(){const j=await auth('/auth/v1/token?grant_type=refresh_token',{refresh_token:refresh});access=j.access_token;refresh=j.refresh_token;sessionStorage.setItem('le_refresh',refresh)}
async function brain(action,retry=true){const r=await fetch(SB+'/functions/v1/leadengine-brain',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({action})});if((r.status===401||r.status===403)&&retry&&refresh){await renew();return brain(action,false)}const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'Server error');return j}
function paint(s){const on=!!s?.sending_enabled;$('state').textContent=on?'LIVE TEST ON':'OFF';$('state').className='big '+(on?'on':'off');$('info').textContent=on?`Maximum ${s.daily_send_cap||3} outbound emails today. Runner checks every 5 minutes.`:'No outbound emails can send.';$('startBtn').disabled=on;$('stopBtn').disabled=!on}
async function refreshStatus(){try{const d=await brain('dashboard');paint(d.sdr_settings||{})}catch(e){$('info').textContent=e.message}}
async function startSDR(){if(!confirm('Start LIVE outreach with a maximum of 3 emails today?'))return;const d=await brain('sdr_start');paint(d.sdr_settings||{});$('info').textContent='STARTED. Maximum 3 outbound emails today. Runner checks every 5 minutes.'}
async function stopSDR(){const d=await brain('sdr_stop');paint(d.sdr_settings||{});$('info').textContent='STOPPED. Outbound sending is disabled.'}
(async()=>{const r=sessionStorage.getItem('le_refresh');if(r){refresh=r;try{await renew();$('loginBox').classList.add('hidden');$('control').classList.remove('hidden');await refreshStatus()}catch{sessionStorage.removeItem('le_refresh')}}})();
</script>
</body>
</html>
