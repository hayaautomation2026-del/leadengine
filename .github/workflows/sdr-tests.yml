name: LeadEngine SDR tests

on:
  push:
    branches: [main]
    paths:
      - 'sdr_worker.py'
      - 'sdr_worker_gemini.py'
      - 'test_followup_engine.py'
      - '.github/workflows/sdr-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run SDR follow-up tests
        run: python -m unittest -v test_followup_engine.py
