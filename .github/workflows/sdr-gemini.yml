name: LeadEngine SDR - Gemini

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdr-gemini.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: leadengine-sdr-gemini
  cancel-in-progress: false

jobs:
  sdr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required secrets
        id: preflight
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for v in SUPABASE_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GEMINI_API_KEY; do
            if [ -z "${!v}" ]; then echo "Missing $v"; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDR dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install --upgrade pip requests supabase==2.3.4

      - name: Run SDR worker (dry-run only)
        if: steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_URL: https://jequjltbvofmhfnbsfzt.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_FROM_EMAIL: aiagentsutomations01@gmail.com
          SDR_FROM_NAME: ${{ secrets.SDR_FROM_NAME || 'Ameer' }}
          SDR_DRY_RUN: 'true'
        run: python sdr_worker_gemini.py

# Safe test trigger only; SDR_DRY_RUN remains true.
