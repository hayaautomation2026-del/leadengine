name: LeadEngine Finder

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Monday 08:00 Pakistan time
  workflow_dispatch:
    inputs:
      search_request:
        description: 'What to find, e.g. dentists in Utah'
        required: false
        type: string
      hard_cap:
        description: 'Maximum leads to save this run'
        required: false
        default: '20'
        type: string

concurrency:
  group: leadengine-finder
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests supabase==2.3.4

      - name: Pull current open-source Maps finder
        run: docker pull gosom/google-maps-scraper:latest

      - name: Run LeadEngine finder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEARCH_REQUEST: ${{ inputs.search_request }}
          HARD_CAP_LEADS: ${{ inputs.hard_cap || '20' }}
          FINDER_SOURCE: gosom_gmaps
        run: python scraper.py
