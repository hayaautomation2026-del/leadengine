name: LeadEngine Finder Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      search_request:
        description: 'Optional direct test search'
        required: false
        type: string
      hard_cap:
        description: 'Maximum leads for a direct test'
        required: false
        default: '20'
        type: string

concurrency:
  group: leadengine-finder-worker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Supabase worker key
        id: preflight
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://jequjltbvofmhfnbsfzt.supabase.co/rest/v1/search_requests?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          if [ "$code" = "200" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Supabase worker key is valid."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Supabase worker key is not configured for the LeadEngine project yet; worker will sleep."
          fi

      - name: Checkout code
        if: steps.preflight.outputs.valid == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: steps.preflight.outputs.valid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependency
        if: steps.preflight.outputs.valid == 'true'
        run: pip install requests
      - name: Pull replaceable Maps finder
        if: steps.preflight.outputs.valid == 'true'
        run: docker pull gosom/google-maps-scraper:latest
      - name: Process one Supabase search request
        if: steps.preflight.outputs.valid == 'true'
        env:
          SUPABASE_URL: https://jequjltbvofmhfnbsfzt.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEARCH_REQUEST: ${{ inputs.search_request }}
          HARD_CAP_LEADS: ${{ inputs.hard_cap || '20' }}
          FINDER_SOURCE: gosom_gmaps
        run: python scraper.py
