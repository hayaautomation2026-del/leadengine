name: LeadEngine Finder Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrape.yml'
      - 'scraper.py'
      - 'crawlee_maps.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      search_request:
        description: 'Optional direct test search'
        required: false
        type: string
      hard_cap:
        description: 'Maximum leads for a direct test'
        required: false
        default: '20'
        type: string

concurrency:
  group: leadengine-finder-worker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check key and pending work
        id: preflight
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DIRECT_REQUEST: ${{ inputs.search_request }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$DIRECT_REQUEST" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          response=$(curl --fail --silent --show-error \
            "https://jequjltbvofmhfnbsfzt.supabase.co/rest/v1/search_requests?status=eq.pending&select=id&order=created_at.asc&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY") || {
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          if [ "$response" = "[]" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.preflight.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.preflight.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests 'crawlee[playwright]'

      - name: Install Playwright Chromium
        if: steps.preflight.outputs.run == 'true'
        run: playwright install chromium --with-deps

      - name: Pull primary free Maps finder
        if: steps.preflight.outputs.run == 'true'
        run: docker pull gosom/google-maps-scraper:latest

      - name: Process LeadEngine search queue
        if: steps.preflight.outputs.run == 'true'
        env:
          SUPABASE_URL: https://jequjltbvofmhfnbsfzt.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEARCH_REQUEST: ${{ inputs.search_request }}
          HARD_CAP_LEADS: ${{ inputs.hard_cap || '20' }}
          FINDER_SOURCE: auto
        run: |
          if [ -n "$SEARCH_REQUEST" ]; then
            python scraper.py
            exit $?
          fi
          for i in $(seq 1 10); do
            pending=$(curl --fail --silent --show-error \
              "${SUPABASE_URL}/rest/v1/search_requests?status=eq.pending&select=id&order=created_at.asc&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY") || break
            if [ "$pending" = "[]" ]; then
              echo "Queue drained."
              break
            fi
            echo "Processing queued search $i"
            python scraper.py || true
          done

