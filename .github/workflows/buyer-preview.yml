name: Buyer reply preview without email
on:
  push:
    branches: [main]
    paths: ['preview_buyer_reply.py', '.github/workflows/buyer-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.31.0
      - run: python -m unittest test_evidence_whitespace test_multi_answer -q
      - run: python preview_buyer_reply.py
        env:
          SUPABASE_URL: https://jequjltbvofmhfnbsfzt.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
