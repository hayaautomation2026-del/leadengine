name: Patch LeadEngine address normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-address-normalization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scraper address handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scraper.py')
          s = p.read_text()
          if 'import json\n' not in s:
              s = s.replace('import hashlib\n', 'import hashlib\nimport json\n')
          marker = '\ndef normalize_raw(row):\n'
          helper = '''\ndef clean_address(raw):\n    if raw is None:\n        return None\n    if isinstance(raw, dict):\n        data = raw\n    else:\n        text = str(raw).strip()\n        if not text:\n            return None\n        data = None\n        if text.startswith("{") and text.endswith("}"):\n            try:\n                parsed = json.loads(text)\n                if isinstance(parsed, dict):\n                    data = parsed\n            except json.JSONDecodeError:\n                pass\n        if data is None:\n            return text[:500]\n    parts = []\n    for key in ("street", "borough", "city", "state", "postal_code", "country"):\n        value = str(data.get(key) or "").strip()\n        if value and value not in parts:\n            parts.append(value)\n    return ", ".join(parts)[:500] or None\n\n'''
          if 'def clean_address(raw):' not in s:
              s = s.replace(marker, helper + marker)
          s = s.replace('"address": (row.get("address") or "").strip() or None,', '"address": clean_address(row.get("address")),')
          s = s.replace('address = (raw.get("address") or "").strip()[:500]', 'address = clean_address(raw.get("address")) or ""')
          p.write_text(s)
          PY
          python -m py_compile scraper.py
          git diff -- scraper.py
      - name: Commit patch
        run: |
          git config user.name "leadengine-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scraper.py
          git commit -m "Normalize scraper addresses" || true
          git push
