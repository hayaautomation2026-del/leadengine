name: Unattended owner inbox
on:
  push:
    branches: [main]
    paths: ['unattended_inbox.py', 'response_audit.py', '.github/workflows/unattended-inbox.yml']
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leadengine-unattended-owner
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.31.0
      - run: python unattended_inbox.py
        env:
          INBOX_CHECK_ID: 07dfa044-4beb-48ec-82e9-b66dd8b7e909
          SUPABASE_URL: https://jequjltbvofmhfnbsfzt.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_FROM_EMAIL: aiagentsutomations01@gmail.com
          SDR_FROM_NAME: Ameer
