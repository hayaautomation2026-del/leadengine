name: LeadEngine Contact Enrichment

on:
  push:
    branches: [main]
    paths:
      - 'enrichment_worker.py'
      - 'niche_worker.py'
      - '.github/workflows/enrich.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: leadengine-contact-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install requests

      - name: Enrich missing contacts
        env:
          SUPABASE_URL: https://jequjltbvofmhfnbsfzt.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python enrichment_worker.py
