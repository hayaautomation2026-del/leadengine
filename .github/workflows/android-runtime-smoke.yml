name: LeadEngine Android Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-runtime-smoke.yml'
      - 'android-native/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leadengine-android-runtime-smoke
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build APK
        working-directory: android-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Boot emulator, install, launch, inspect UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.hayaautomation.leadengine
            adb shell monkey -p com.hayaautomation.leadengine -c android.intent.category.LAUNCHER 1
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window.xml
            adb shell dumpsys activity activities > /tmp/activity.txt
            mkdir -p ci-reports
            {
              echo "COMMIT=${GITHUB_SHA}"
              echo "TESTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if grep -q 'LeadEngine' /tmp/window.xml && grep -q 'Password\|Enter password' /tmp/window.xml; then
                echo "RESULT=PASS_LOGIN_UI"
              else
                echo "RESULT=FAIL_LOGIN_UI"
              fi
              echo "---- ACTIVITY ----"
              grep -E 'mResumedActivity|topResumedActivity|FastLauncherActivity|UsableMainActivity' /tmp/activity.txt | head -20 || true
              echo "---- UI ----"
              sed 's/></>\n</g' /tmp/window.xml | grep -E 'LeadEngine|Password|Enter password|Open|Run Search|Find businesses' | head -40 || true
            } > ci-reports/android-runtime-smoke.txt

      - name: Commit runtime result
        if: always()
        run: |
          if [ ! -f ci-reports/android-runtime-smoke.txt ]; then
            mkdir -p ci-reports
            {
              echo "COMMIT=${GITHUB_SHA}"
              echo "RESULT=FAIL_BEFORE_UI_CHECK"
              echo "TESTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > ci-reports/android-runtime-smoke.txt
          fi
          git config user.name "leadengine-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-reports/android-runtime-smoke.txt
          git commit -m "Record Android runtime smoke ${GITHUB_SHA::7}" || true
          git push || true
