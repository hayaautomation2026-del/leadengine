name: Build LeadEngine Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: leadengine-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare bundled LeadEngine web app
        run: |
          rm -rf webapp
          mkdir -p webapp
          cp index.html webapp/index.html
          cp dashboard.html webapp/dashboard.html
          cp leadengine-app.json webapp/leadengine-app.json || true
          cp sw.js webapp/sw.js || true
          cp leadengine-icon.svg webapp/leadengine-icon.svg || true

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync LeadEngine into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LeadEngine-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadEngine-Android-APK
          path: LeadEngine-debug.apk
          retention-days: 30
