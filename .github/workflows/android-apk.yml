name: Build Native LeadEngine Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: leadengine-native-android
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build native debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and inspect manifest
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'com.hayaautomation.leadengine.FastLauncherActivity' /tmp/manifest.txt
          grep -q 'com.hayaautomation.leadengine.UsableMainActivity' /tmp/manifest.txt
          mkdir -p ../ci-reports
          {
            echo "RESULT=PASS"
            echo "COMMIT=${GITHUB_SHA}"
            echo "APK_SHA256=${SHA}"
            echo "APK_BYTES=${SIZE}"
            echo "LAUNCHER=FastLauncherActivity"
            echo "RESULTS_SCREEN=UsableMainActivity"
            echo "VERIFIED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../ci-reports/android-build.txt

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../LeadEngine-native-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadEngine-Native-Android-APK
          path: LeadEngine-native-debug.apk
          retention-days: 30

      - name: Commit verification report
        working-directory: .
        run: |
          git config user.name "leadengine-ci"
          git config user.email "actions@users.noreply.github.com"
          git add ci-reports/android-build.txt
          git commit -m "Record verified Android build ${GITHUB_SHA::7}" || exit 0
          git push
