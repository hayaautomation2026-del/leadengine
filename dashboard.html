<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06100e">
<title>LeadEngine</title>
<style>
:root{--bg:#06100e;--panel:#0d1c18;--line:#48ffa228;--green:#48ffa2;--orange:#ff8a3d;--blue:#54bfff;--purple:#bd80ff;--red:#ff5f7d;--text:#f4fff9;--muted:#829e94}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#00d97b20,transparent 28%),linear-gradient(#07110f,#040a08);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.wrap{max-width:1250px;margin:auto;padding:26px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:26px;font-weight:950}.brand span{color:var(--green)}.muted{color:var(--muted);font-size:11px}.btn{border:1px solid var(--line);background:#071511;color:var(--green);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer}.hero,.panel,.kpi{border:1px solid var(--line);background:#0d1c18e8;border-radius:20px;box-shadow:0 18px 55px #0005}.hero{padding:20px;margin:20px 0 14px}.hero h2{margin:4px 0 14px}.searchrow{display:grid;grid-template-columns:1fr 90px 150px;gap:8px}.field{width:100%;border:1px solid #48ffa244;background:#06100e;color:var(--text);border-radius:13px;padding:13px;outline:none}.run{border:0;border-radius:13px;background:linear-gradient(135deg,var(--green),#00d97b);color:#04100a;font-weight:950;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kpi{padding:15px}.kpi small{color:var(--muted)}.num{font-size:29px;font-weight:950;margin-top:5px}.orange{color:var(--orange)}.blue{color:var(--blue)}.green{color:var(--green)}.purple{color:var(--purple)}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.stack{display:grid;gap:12px}.panel{overflow:hidden}.ph{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ph h3{margin:0;font-size:14px}.body{padding:7px}.row{padding:11px;border-bottom:1px solid #48ffa214;display:flex;align-items:center;justify-content:space-between;gap:10px}.row:last-child{border-bottom:0}.name{font-weight:850;font-size:12px}.meta{color:var(--muted);font-size:9px;margin-top:4px}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:9px}.score{font-weight:950;color:var(--orange)}.tools{display:flex;gap:6px}.icon{border:1px solid var(--line);background:#071511;color:var(--green);border-radius:9px;padding:6px;text-decoration:none;cursor:pointer}.empty{padding:25px;text-align:center;color:var(--muted);font-size:11px}.login{position:fixed;inset:0;z-index:100;background:#020806f4;display:grid;place-items:center;padding:18px}.login.hidden{display:none}.card{width:min(430px,100%);padding:23px;border:1px solid #48ffa244;border-radius:23px;background:#0b1a16;box-shadow:0 25px 80px #0009}.card h1{margin:8px 0 4px}.card input{margin-top:10px}.card button{width:100%;height:48px;margin-top:12px}.error{color:var(--red);font-size:11px;margin-top:8px}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:90;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#0d1c18;border:1px solid #48ffa244;border-radius:22px 22px 0 0;padding:20px}.status{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.status button{border:1px solid var(--line);background:#071511;color:var(--text);padding:8px;border-radius:10px}.status button.on{color:var(--green);border-color:#48ffa277}.sheet textarea{min-height:90px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#04100a;padding:9px 14px;border-radius:999px;font-size:10px;font-weight:900;display:none}.toast.show{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.searchrow{grid-template-columns:1fr}.run{height:48px}} 
</style>
</head>
<body>
<div class="login" id="login"><div class="card"><div class="brand">⚡ Lead<span>Engine</span></div><h1>Owner sign-in</h1><div class="muted">This dashboard is private. Public Supabase keys no longer unlock it.</div><input class="field" id="email" value="hayaautomation2026@gmail.com" readonly><input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password"><div class="error" id="loginError"></div><button class="run" onclick="login()">Unlock LeadEngine</button></div></div>
<div class="wrap">
<div class="top"><div><div class="brand">⚡ Lead<span>Engine</span></div><div class="muted">Private owner command center</div></div><div><button class="btn" onclick="refreshAll()">↻ Sync</button> <button class="btn" onclick="logout()">Lock</button></div></div>
<section class="hero"><div class="muted green">LIVE SEARCH</div><h2>What businesses do you want?</h2><div class="searchrow"><input class="field" id="query" placeholder="e.g. Dentists in Utah"><select class="field" id="limit"><option>3</option><option selected>10</option><option>20</option><option>50</option></select><button class="run" id="run" onclick="runSearch()">⚡ Run Search</button></div></section>
<div class="kpis"><div class="kpi"><small>🔥 Hot Leads</small><div class="num orange" id="hot">—</div></div><div class="kpi"><small>⚡ Working</small><div class="num blue" id="working">—</div></div><div class="kpi"><small>✓ Converted</small><div class="num green" id="won">—</div></div><div class="kpi"><small>◎ Total Leads</small><div class="num purple" id="total">—</div></div></div>
<div class="grid"><section class="panel"><div class="ph"><h3>Top Leads</h3><span class="muted" id="count"></span></div><div class="body" id="leads"></div></section><div class="stack"><section class="panel"><div class="ph"><h3>Search Queue</h3></div><div class="body" id="queue"></div></section><section class="panel"><div class="ph"><h3>Saved Searches</h3><button class="btn" onclick="saveSearch()">+ Save current</button></div><div class="body" id="saved"></div></section><section class="panel"><div class="ph"><h3>Recent Runs</h3></div><div class="body" id="runs"></div></section></div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="top"><h3 id="leadName">Lead</h3><button class="btn" onclick="closeModal()">×</button></div><div class="muted" id="leadMeta"></div><div class="status" id="statuses"></div><textarea class="field" id="notes" placeholder="Notes"></textarea><button class="run" style="width:100%;height:46px" onclick="saveLead()">Save Lead</button></div></div>
<div class="toast" id="toast"></div>
<script>
const SB='https://jequjltbvofmhfnbsfzt.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXVqbHRidm9mbWhmbmJzZnp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NjM3MDYsImV4cCI6MjA5ODMzOTcwNn0.swI7ZldCu4W0fyFNjiOoBMkINEKBfozAVnVJjXj_6VM';
let access='',refresh='',leads=[],requests=[],saved=[],runs=[],active=null,status='';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
async function auth(url,body,bearer=''){const r=await fetch(SB+url,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',...(bearer?{Authorization:'Bearer '+bearer}:{})},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('auth');return j}
async function login(){try{$('loginError').textContent='';const j=await auth('/auth/v1/token?grant_type=password',{email:$('email').value,password:$('password').value});access=j.access_token;refresh=j.refresh_token;sessionStorage.setItem('le_refresh',refresh);$('password').value='';$('login').classList.add('hidden');await refreshAll()}catch{$('loginError').textContent='Wrong password or connection failed.'}}
async function restore(){const r=sessionStorage.getItem('le_refresh');if(!r)return;refresh=r;try{await renew();$('login').classList.add('hidden');await refreshAll()}catch{logout()}}
async function renew(){const j=await auth('/auth/v1/token?grant_type=refresh_token',{refresh_token:refresh});access=j.access_token;refresh=j.refresh_token;sessionStorage.setItem('le_refresh',refresh)}
function logout(){access='';refresh='';sessionStorage.removeItem('le_refresh');$('login').classList.remove('hidden')}
async function brain(action,payload={},retry=true){if(!access)throw new Error('login');const r=await fetch(SB+'/functions/v1/leadengine-brain',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});if((r.status===401||r.status===403)&&retry&&refresh){await renew();return brain(action,payload,false)}const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'server');return j}
async function refreshAll(){if(!access)return;try{const d=await brain('dashboard');leads=d.leads||[];requests=d.requests||[];saved=d.saved_searches||[];runs=d.runs||[];render()}catch(e){console.error(e);toast('Connection failed')}}
function parse(v){const m=v.trim().match(/^(.*?)\s+in\s+(.+)$/i);return m?{query:m[1].trim(),location:m[2].trim()}:{query:v.trim(),location:null}}
async function runSearch(){const v=$('query').value.trim();if(!v)return toast('Type a search');const p=parse(v);$('run').disabled=true;try{await brain('search',{...p,max_leads:Number($('limit').value)});toast('Search queued ✓');await refreshAll()}catch(e){toast(String(e.message).includes('limit')?'Search limit reached':'Search failed')}finally{$('run').disabled=false}}
async function saveSearch(){const v=$('query').value.trim();if(!v)return toast('Type a search');try{await brain('save_search',{...parse(v),max_leads:Number($('limit').value),interval_hours:24});toast('Saved ✓');refreshAll()}catch{toast('Could not save')}}
async function toggleSaved(id,enabled){try{await brain('toggle_saved',{id,enabled});refreshAll()}catch{toast('Could not update')}}
function render(){const hot=leads.filter(x=>(x.pain_score||0)>=70&&x.contact_status==='new').length;const working=requests.filter(x=>['pending','processing','running'].includes(x.status)).length;const won=leads.filter(x=>x.contact_status==='converted').length;$('hot').textContent=hot;$('working').textContent=working;$('won').textContent=won;$('total').textContent=leads.length;$('count').textContent=leads.length+' leads';
$('leads').innerHTML=leads.length?leads.slice(0,50).map(l=>{const phone=l.whatsapp_number||l.phone_number||'';return `<div class="row"><div style="flex:1"><div class="name">${esc(l.full_name||l.agency_name||'Unknown')}</div><div class="meta">${esc([l.city,l.country].filter(Boolean).join(' · ')||l.pain_reason||'')}</div></div><span class="score">${l.pain_score||0}</span><span class="badge">${esc(l.contact_status||'new')}</span><div class="tools">${phone?`<a class="icon" href="tel:${esc(phone)}">☎</a><a class="icon" target="_blank" rel="noopener" href="https://wa.me/${phone.replace(/\D/g,'')}">💬</a>`:''}<button class="icon" onclick="openLead('${l.id}')">✎</button></div></div>`}).join(''):'<div class="empty">No leads yet.</div>';
$('queue').innerHTML=requests.length?requests.slice(0,12).map(r=>`<div class="row"><div><div class="name">${esc(r.query)}${r.location?' in '+esc(r.location):''}</div><div class="meta">Up to ${r.max_leads||20} leads</div></div><span class="badge">${esc(r.status)}</span></div>`).join(''):'<div class="empty">Queue is clear.</div>';
$('saved').innerHTML=saved.length?saved.slice(0,12).map(s=>`<div class="row"><div><div class="name">${esc(s.query)}${s.location?' in '+esc(s.location):''}</div><div class="meta">Every ${s.interval_hours||24}h</div></div><button class="btn" onclick="toggleSaved('${s.id}',${!s.enabled})">${s.enabled?'Pause':'Resume'}</button></div>`).join(''):'<div class="empty">No saved searches.</div>';
$('runs').innerHTML=runs.length?runs.slice(0,12).map(r=>`<div class="row"><div><div class="name">${r.leads_inserted||0} leads added</div><div class="meta">${r.leads_fetched||0} fetched</div></div><span class="badge">${esc(r.status)}</span></div>`).join(''):'<div class="empty">No runs yet.</div>'}
const states=['new','contacted','qualified','converted','cold','no_reply'];function openLead(id){active=leads.find(x=>x.id===id);if(!active)return;status=active.contact_status||'new';$('leadName').textContent=active.full_name||active.agency_name||'Lead';$('leadMeta').textContent=[active.phone_number,active.pain_reason].filter(Boolean).join(' · ');$('notes').value=active.notes||'';drawStates();$('modal').classList.add('show')}function drawStates(){$('statuses').innerHTML=states.map(s=>`<button class="${s===status?'on':''}" onclick="status='${s}';drawStates()">${s.replace('_',' ')}</button>`).join('')}function closeModal(){$('modal').classList.remove('show')}async function saveLead(){try{await brain('update_lead',{id:active.id,contact_status:status,notes:$('notes').value});closeModal();toast('Lead saved ✓');refreshAll()}catch{toast('Save failed')}}
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});restore();setInterval(()=>{if(access)refreshAll()},60000);
</script>
</body>
</html>
