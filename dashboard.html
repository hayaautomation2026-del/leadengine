<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeadEngine</title><style>
:root{--bg:#06100e;--panel:#0d1c18;--line:#48ffa228;--green:#48ffa2;--orange:#ff8a3d;--blue:#54bfff;--purple:#bd80ff;--red:#ff5f7d;--text:#f4fff9;--muted:#829e94}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07110f,#040a08);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:25px;font-weight:950}.brand span{color:var(--green)}.muted{color:var(--muted);font-size:11px}.panel,.hero,.kpi{border:1px solid var(--line);background:var(--panel);border-radius:18px}.hero{padding:18px;margin:18px 0 12px}.searchrow{display:grid;grid-template-columns:1fr 220px 90px 130px;gap:8px;margin-top:12px}.field,.btn{border:1px solid var(--line);background:#06100e;color:var(--text);border-radius:11px;padding:11px}.run{border:0;border-radius:11px;background:var(--green);color:#04100a;font-weight:900;cursor:pointer}.btn{color:var(--green);cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.kpi{padding:14px}.kpi small{color:var(--muted)}.num{font-size:27px;font-weight:950}.orange{color:var(--orange)}.blue{color:var(--blue)}.green{color:var(--green)}.purple{color:var(--purple)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.panel{overflow:hidden}.ph{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.body{padding:6px}.row{padding:10px;border-bottom:1px solid #48ffa214;display:flex;gap:9px;align-items:center}.name{font-weight:850;font-size:12px}.meta{font-size:9px;color:var(--muted);margin-top:3px}.score{margin-left:auto;color:var(--orange);font-weight:900}.badge{border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:9px}.login{position:fixed;inset:0;background:#020806f5;z-index:10;display:grid;place-items:center}.login.hidden{display:none}.card{width:min(420px,92%);padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:20px}.card .field{display:block;width:100%;margin:9px 0}.error{color:var(--red);font-size:11px}.modal{display:none;position:fixed;inset:0;background:#000a;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(560px,100%);background:var(--panel);padding:20px;border-radius:20px 20px 0 0}.status{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.status button{background:#071511;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}.status .on{color:var(--green)}textarea{width:100%;min-height:90px}.empty{padding:22px;text-align:center;color:var(--muted)}@media(max-width:800px){.searchrow,.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="login" id="login"><div class="card"><div class="brand">⚡ Lead<span>Engine</span></div><h2>Owner sign-in</h2><input class="field" id="email" value="hayaautomation2026@gmail.com" readonly><input class="field" id="password" type="password" placeholder="Password"><div class="error" id="loginError"></div><button class="run" style="width:100%;padding:12px" onclick="login()">Unlock LeadEngine</button></div></div>
<div class="wrap"><div class="top"><div><div class="brand">⚡ Lead<span>Engine</span></div><div class="muted">General business lead engine</div></div><div><button class="btn" onclick="refreshAll()">↻ Sync</button><button class="btn" onclick="logout()">Lock</button></div></div>
<section class="hero"><div class="muted">SEARCH BY NICHE</div><h2>Find businesses</h2><div class="searchrow"><input class="field" id="query" placeholder="e.g. dentists"><select class="field" id="niche"></select><select class="field" id="limit"><option>10</option><option>20</option><option>30</option><option>50</option></select><button class="run" onclick="runSearch()" id="run">⚡ Search</button></div></section>
<div class="kpis"><div class="kpi"><small>🔥 Hot</small><div class="num orange" id="hot">—</div></div><div class="kpi"><small>⚡ Working</small><div class="num blue" id="working">—</div></div><div class="kpi"><small>✓ Converted</small><div class="num green" id="won">—</div></div><div class="kpi"><small>◎ Total</small><div class="num purple" id="total">—</div></div></div>
<div class="grid"><section class="panel"><div class="ph"><b>Leads</b><span class="muted" id="count"></span></div><div class="body" id="leads"></div></section><div><section class="panel"><div class="ph"><b>Search Queue</b></div><div class="body" id="queue"></div></section><br><section class="panel"><div class="ph"><b>Saved Searches</b><button class="btn" onclick="saveSearch()">+ Save</button></div><div class="body" id="saved"></div></section><br><section class="panel"><div class="ph"><b>Recent Runs</b></div><div class="body" id="runs"></div></section></div></div></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="top"><h3 id="leadName"></h3><button class="btn" onclick="closeModal()">×</button></div><div class="muted" id="leadMeta"></div><div class="status" id="statuses"></div><textarea class="field" id="notes" placeholder="Notes"></textarea><button class="run" style="width:100%;padding:12px" onclick="saveLead()">Save Lead</button></div></div>
<script>
const SB='https://jequjltbvofmhfnbsfzt.supabase.co';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcXVqbHRidm9mbWhmbmJzZnp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NjM3MDYsImV4cCI6MjA5ODMzOTcwNn0.swI7ZldCu4W4MfyFNjiOoBMkINEKBfozAVnVJjXj_6VM';
let access='',refresh='',leads=[],requests=[],saved=[],runs=[],niches=[],active=null,status='';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function auth(url,body){const r=await fetch(SB+url,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error('auth');return j}
async function login(){try{const j=await auth('/auth/v1/token?grant_type=password',{email:$('email').value,password:$('password').value});access=j.access_token;refresh=j.refresh_token;sessionStorage.setItem('le_refresh',refresh);$('login').classList.add('hidden');await refreshAll()}catch{$('loginError').textContent='Wrong password or connection failed.'}}
async function renew(){const j=await auth('/auth/v1/token?grant_type=refresh_token',{refresh_token:refresh});access=j.access_token;refresh=j.refresh_token;sessionStorage.setItem('le_refresh',refresh)}
function logout(){access='';refresh='';sessionStorage.removeItem('le_refresh');$('login').classList.remove('hidden')}
async function brain(action,payload={},retry=true){const r=await fetch(SB+'/functions/v1/leadengine-brain',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});if((r.status===401||r.status===403)&&retry&&refresh){await renew();return brain(action,payload,false)}const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'server');return j}
async function refreshAll(){if(!access)return;try{const d=await brain('dashboard');leads=d.leads||[];requests=d.requests||[];saved=d.saved_searches||[];runs=d.runs||[];niches=d.niches||[];$('niche').innerHTML=niches.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('');render()}catch(e){console.error(e)}}
function parse(v){const m=v.trim().match(/^(.*?)\s+in\s+(.+)$/i);return m?{query:m[1].trim(),location:m[2].trim()}:{query:v.trim(),location:null}}
async function runSearch(){const v=$('query').value.trim();if(!v)return;const p=parse(v);$('run').disabled=true;try{await brain('search',{...p,max_leads:+$('limit').value,niche_id:$('niche').value});await refreshAll()}finally{$('run').disabled=false}}
async function saveSearch(){const v=$('query').value.trim();if(!v)return;const p=parse(v);try{await brain('save_search',{...p,max_leads:+$('limit').value,interval_hours:24,niche_id:$('niche').value});await refreshAll()}catch(e){console.error(e)}}
async function toggleSaved(id,enabled){await brain('toggle_saved',{id,enabled});refreshAll()}
function render(){const hot=leads.filter(x=>(x.pain_score||0)>=70&&x.contact_status==='new').length;const working=requests.filter(x=>['pending','running'].includes(x.status)).length;const won=leads.filter(x=>x.contact_status==='converted').length;$('hot').textContent=hot;$('working').textContent=working;$('won').textContent=won;$('total').textContent=leads.length;$('count').textContent=leads.length+' leads';$('leads').innerHTML=leads.length?leads.map(l=>`<div class="row"><div><div class="name">${esc(l.business_name||l.full_name||'Unknown')}</div><div class="meta">${esc([niches.find(n=>n.id===l.niche_id)?.name,l.city,l.country].filter(Boolean).join(' · ')||l.pain_reason||'')}</div></div><span class="score">${l.pain_score||0}</span><span class="badge">${esc(l.contact_status||'new')}</span><button class="btn" onclick="openLead('${l.id}')">Edit</button></div>`).join(''):'<div class="empty">No leads yet.</div>';$('queue').innerHTML=requests.length?requests.slice(0,10).map(r=>`<div class="row"><div><div class="name">${esc(r.query)}</div><div class="meta">${esc(niches.find(n=>n.id===r.niche_id)?.name||'')} · ${r.max_leads||20}</div></div><span class="badge">${esc(r.status)}</span></div>`).join(''):'<div class="empty">Queue clear.</div>';$('saved').innerHTML=saved.length?saved.slice(0,10).map(s=>`<div class="row"><div><div class="name">${esc(s.query)}</div><div class="meta">${esc(niches.find(n=>n.id===s.niche_id)?.name||'')} · every ${s.interval_hours||24}h</div></div><button class="btn" onclick="toggleSaved('${s.id}',${!s.enabled})">${s.enabled?'Pause':'Resume'}</button></div>`).join(''):'<div class="empty">No saved searches.</div>';$('runs').innerHTML=runs.length?runs.slice(0,10).map(r=>`<div class="row"><div><div class="name">${r.leads_inserted||0} added</div><div class="meta">${esc(niches.find(n=>n.id===r.niche_id)?.name||'')}</div></div><span class="badge">${esc(r.status)}</span></div>`).join(''):'<div class="empty">No runs yet.</div>'}
const states=['new','contacted','qualified','converted','cold','no_reply'];function openLead(id){active=leads.find(x=>x.id===id);status=active?.contact_status||'new';$('leadName').textContent=active?.business_name||'Lead';$('leadMeta').textContent=[active?.phone_number,active?.pain_reason].filter(Boolean).join(' · ');$('notes').value=active?.notes||'';$('statuses').innerHTML=states.map(s=>`<button class="${s===status?'on':''}" onclick="status='${s}';openLead('${id}')">${s.replace('_',' ')}</button>`).join('');$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}async function saveLead(){await brain('update_lead',{id:active.id,contact_status:status,notes:$('notes').value});closeModal();await refreshAll()}
(async()=>{const r=sessionStorage.getItem('le_refresh');if(r){refresh=r;try{await renew();$('login').classList.add('hidden');await refreshAll()}catch{logout()}}})();
</script></body></html>
